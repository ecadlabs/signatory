version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "19:00"
    pull-request-branch-name:
      separator: "-"
  - package-ecosystem: "npm"
    # Disable both version updates (open-pull-requests-limit: 0) and security
    # update PRs (ignore: "*") for the static website in /website.
    directory: "/website"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
    pull-request-branch-name:
      separator: "-"
